name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        working-directory: clinical_protocol_agent_final
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: isort (check)
        working-directory: clinical_protocol_agent_final
        run: python -m isort . --check-only
      - name: black (check)
        working-directory: clinical_protocol_agent_final
        run: python -m black --check .
      - name: ruff (check)
        working-directory: clinical_protocol_agent_final
        run: python -m ruff check .
      - name: Run tests (pytest)
        working-directory: clinical_protocol_agent_final
        run: pytest -q

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: clinical_protocol_agent_final/web
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund --save-dev eslint@8 prettier eslint-config-prettier eslint-plugin-react @typescript-eslint/parser @typescript-eslint/eslint-plugin eslint-plugin-react-hooks
      - name: Run lint (frontend)
        working-directory: clinical_protocol_agent_final/web
        run: npm run lint || npm run lint:fix
      - name: Build frontend
        working-directory: clinical_protocol_agent_final/web
        run: npm run build
